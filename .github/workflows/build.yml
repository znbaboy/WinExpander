name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with this tag (e.g. v1.0.0). Leave empty to just build.'
        required: false
        default: ''
      reset_releases:
        description: 'Delete ALL existing releases and tags first'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  reset:
    if: github.event_name == 'workflow_dispatch' && inputs.reset_releases
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list -R "$REPO" --limit 100 --json tagName -q '.[].tagName'); do
            echo "Deleting release $tag"
            gh release delete "$tag" -R "$REPO" --yes --cleanup-tag
          done
          for tag in $(gh api "repos/$REPO/tags" -q '.[].name'); do
            echo "Deleting tag $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
          done

  build:
    needs: reset
    if: always() && needs.reset.result != 'failure' && needs.reset.result != 'cancelled'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Publish portable
        run: >
          msbuild WinExpander.csproj /restore /t:Publish /m
          /p:Configuration=Release /p:Platform=${{ matrix.arch }}
          /p:RuntimeIdentifier=win-${{ matrix.arch }}
          /p:PublishDir=${{ github.workspace }}\publish\WinExpander\

      - name: Verify app resources
        shell: pwsh
        run: |
          $d = 'publish/WinExpander'
          Get-ChildItem $d -Recurse -Include *.pri,*.xbf | ForEach-Object { $_.FullName }
          if (-not (Test-Path "$d/WinExpander.pri")) { throw 'WinExpander.pri missing from publish output' }

      - name: Smoke test (launch, single instance, close to tray, --tray)
        if: matrix.arch == 'x64'
        shell: powershell
        env:
          TEXTEXPANDER_NO_DIALOG: '1'
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class U {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          }
          "@
          $d = Resolve-Path 'publish/WinExpander'
          $exe = "$d\WinExpander.exe"
          function Fail($m) { if (Test-Path "$d\crash.log") { Get-Content "$d\crash.log" }; throw $m }

          $p = Start-Process $exe -PassThru
          Start-Sleep 15
          if ($p.HasExited) { Fail "App exited early with code $($p.ExitCode)" }
          $p.Refresh(); $h = $p.MainWindowHandle
          if (-not [U]::IsWindowVisible($h)) { Fail 'Window not visible' }
          Write-Host 'Launch OK'

          $p2 = Start-Process $exe -PassThru
          Start-Sleep 5
          if (-not $p2.HasExited) { Stop-Process $p2 -Force; Fail 'Second instance did not exit' }
          Write-Host 'Single instance OK'

          [U]::PostMessage($h, 0x10, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null   # WM_CLOSE
          Start-Sleep 3
          if ($p.HasExited) { Fail 'Closing exited the app instead of hiding to tray' }
          if ([U]::IsWindowVisible($h)) { Fail 'Window still visible after close' }
          Write-Host 'Close to tray OK'

          $p3 = Start-Process $exe -PassThru   # should bring the hidden window back
          Start-Sleep 4
          if (-not [U]::IsWindowVisible($h)) { Fail 'Second launch did not restore the window' }
          Write-Host 'Restore from second launch OK'
          Stop-Process $p -Force
          Start-Sleep 2

          $p = Start-Process $exe -ArgumentList '--tray' -PassThru
          Start-Sleep 10
          if ($p.HasExited) { Fail '--tray launch exited' }
          $p.Refresh()
          if ($p.MainWindowHandle -ne [IntPtr]::Zero -and [U]::IsWindowVisible($p.MainWindowHandle)) { Fail '--tray showed the window' }
          Write-Host '--tray OK'
          Stop-Process $p -Force
          Start-Sleep 2
          if (Test-Path "$d\crash.log") { Get-Content "$d\crash.log"; throw 'crash.log written' }
          Remove-Item "$d\snippets.json", "$d\settings.json" -ErrorAction SilentlyContinue

      - name: Settings navigation test (UI Automation click)
        if: matrix.arch == 'x64'
        shell: powershell
        env:
          TEXTEXPANDER_NO_DIALOG: '1'
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $d = Resolve-Path 'publish/WinExpander'
          $app = Start-Process "$d\WinExpander.exe" -PassThru
          Start-Sleep 12
          $app.Refresh()
          $win = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
          $all = [System.Windows.Automation.TreeScope]::Descendants
          function Find($name, $type) {
            $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            if ($type) {
              $t = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, $type)
              $c = New-Object System.Windows.Automation.AndCondition($c, $t)
            }
            $win.FindFirst($all, $c)
          }
          function Click($el) {
            $p = $null
            if ($el.TryGetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern, [ref]$p)) { $p.Select() }
            elseif ($el.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$p)) { $p.Invoke() }
            else { throw "'$($el.Current.Name)' cannot be clicked" }
          }
          $ok = $true
          # 1) Sidebar "Settings" button
          $btn = Find 'Open settings' ([System.Windows.Automation.ControlType]::Button)
          if (-not $btn) { Write-Host 'No sidebar Settings button'; $ok = $false }
          else { Click $btn; Start-Sleep 3; if (Find 'App theme') { Write-Host 'Sidebar Settings button OK' } else { Write-Host 'Sidebar button did not open Settings'; $ok = $false } }
          # back to Snippets, then 2) navigation pane Settings item
          Click (Find 'Snippets' ([System.Windows.Automation.ControlType]::ListItem)); Start-Sleep 2
          $item = Find 'Settings' ([System.Windows.Automation.ControlType]::ListItem)
          if (-not $item) { Write-Host 'No Settings item in navigation pane'; $ok = $false }
          else { Click $item; Start-Sleep 3; if (Find 'App theme') { Write-Host 'Nav Settings item OK' } else { Write-Host 'Nav item did not open Settings'; $ok = $false } }
          Stop-Process $app -Force
          Start-Sleep 2
          if (Test-Path "$d\crash.log") { Get-Content "$d\crash.log"; Remove-Item "$d\crash.log" }
          Remove-Item "$d\snippets.json", "$d\settings.json" -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'Settings navigation failed' }
          Write-Host 'Settings navigation OK'

      - name: Resource usage
        if: matrix.arch == 'x64'
        shell: powershell
        env:
          TEXTEXPANDER_NO_DIALOG: '1'
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class R { [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l); }
          "@
          $d = Resolve-Path 'publish/WinExpander'
          $app = Start-Process "$d\WinExpander.exe" -PassThru
          function Measure($label) {
            $app.Refresh()
            $wv = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)
            $wvWs = ($wv | Measure-Object WorkingSet64 -Sum).Sum
            $wvPriv = ($wv | Measure-Object PrivateMemorySize64 -Sum).Sum
            $line = '{0,-22} app WS {1,6:N1} MB  private {2,6:N1} MB  threads {3,3} | WebView2 x{4} WS {5,6:N1} MB private {6,6:N1} MB | CPU {7:N2}s' -f `
              $label, ($app.WorkingSet64/1MB), ($app.PrivateMemorySize64/1MB), $app.Threads.Count, $wv.Count, ($wvWs/1MB), ($wvPriv/1MB), $app.TotalProcessorTime.TotalSeconds
            Write-Host "USAGE: $line"
          }
          Start-Sleep 15; Measure 'Window open (15s)'
          $app.Refresh(); $h = $app.MainWindowHandle
          Start-Sleep 30; Measure 'Window open idle (45s)'
          [R]::PostMessage($h, 0x10, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
          Start-Sleep 15; Measure 'In tray (15s)'
          Start-Sleep 30; Measure 'In tray idle (45s)'
          Stop-Process $app -Force
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $size = (Get-ChildItem $d -Recurse | Measure-Object Length -Sum).Sum
          Write-Host ('USAGE: Publish folder {0:N1} MB, {1} files' -f ($size/1MB), (Get-ChildItem $d -Recurse -File).Count)
          Remove-Item "$d\snippets.json", "$d\settings.json", "$d\crash.log" -ErrorAction SilentlyContinue

      - name: Expansion test (Notepad)
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          TEXTEXPANDER_NO_DIALOG: '1'
        run: |
          $d = Resolve-Path 'publish/WinExpander'
          $app = Start-Process "$d/WinExpander.exe" -PassThru
          Start-Sleep 10
          $np = Start-Process notepad -PassThru
          Start-Sleep 4
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate('Notepad')
          Start-Sleep 1
          $ws.SendKeys('hi ;sig')
          Start-Sleep 3
          $ws.SendKeys('^a'); Start-Sleep 1
          $ws.SendKeys('^c'); Start-Sleep 1
          $text = Get-Clipboard -Raw
          Write-Host "Notepad text: [$text]"
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process $app -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          if (Test-Path "$d/crash.log") { Get-Content "$d/crash.log"; Remove-Item "$d/crash.log" }
          Remove-Item "$d/snippets.json" -ErrorAction SilentlyContinue
          if ($text -notmatch 'hi Best regards' -or $text -notmatch '\*\*Your Name\*\*') { throw 'Expansion test failed' }
          Write-Host 'Plain-text expansion OK (Markdown source)'

      - name: Rich-text test (Edge contenteditable)
        if: matrix.arch == 'x64'
        shell: powershell
        env:
          TEXTEXPANDER_NO_DIALOG: '1'
        run: |
          $d = Resolve-Path 'publish/WinExpander'
          $app = Start-Process "$d/WinExpander.exe" -PassThru
          Start-Sleep 10
          $page = Join-Path $env:RUNNER_TEMP 'richtest.html'
          '<html><head><title>RichTest</title></head><body><div id="e" contenteditable="true" style="height:90vh"></div><script>document.getElementById("e").focus()</script></body></html>' | Set-Content $page -Encoding UTF8
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $url = 'file:///' + ($page -replace '\\','/')
          Start-Process $edge "--no-first-run --no-default-browser-check --disable-features=msEdgeFRE --user-data-dir=$env:RUNNER_TEMP\edgeprof --app=$url"
          Start-Sleep 10
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate('RichTest')
          Start-Sleep 2
          $ws.SendKeys('hi ;sig')
          Start-Sleep 3
          $ws.SendKeys('^a'); Start-Sleep 1
          $ws.SendKeys('^c'); Start-Sleep 1
          $html = Get-Clipboard -TextFormatType Html -Raw
          $txt = Get-Clipboard -Raw
          Write-Host "Copied text: [$txt]"
          Write-Host "Copied HTML:"; Write-Host $html
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process $app -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          if (Test-Path "$d/crash.log") { Get-Content "$d/crash.log"; Remove-Item "$d/crash.log" }
          Remove-Item "$d/snippets.json", "$d/settings.json" -ErrorAction SilentlyContinue
          if ($html -notmatch '<(strong|b)\b[^>]*>Your Name</') { throw 'Rich-text paste did not produce bold text' }
          if ($txt -notmatch 'hi Best regards') { throw 'Trigger was not replaced cleanly' }
          Write-Host 'Rich-text expansion OK'

      - name: Screenshot (dark mode)
        if: matrix.arch == 'x64'
        continue-on-error: true
        shell: powershell
        env:
          TEXTEXPANDER_NO_DIALOG: '1'
        run: |
          $d = Resolve-Path 'publish/WinExpander'
          reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize /v AppsUseLightTheme /t REG_DWORD /d 0 /f | Out-Null
          # Demo snippets for the screenshot
          $demo = @(
            @{ Trigger = ';reply'; Text = "Hi there,`n`nThanks for reaching out! Here's a quick summary:`n`n- **Status:** shipped ``v1.0``  `n- **Docs:** [read more](https://example.com)`n- [x] Tested on Windows 11`n`n> Let me know if you have questions.`n`nBest,`n*Alex*" },
            @{ Trigger = ';sig';   Text = "Best regards,`n**Your Name**" },
            @{ Trigger = ';em';    Text = 'me@example.com' },
            @{ Trigger = ';table'; Text = "| Plan | Price |`n|---|---|`n| Free | `$0 |`n| Pro | `$5 |" }
          )
          $demo | ConvertTo-Json | Set-Content "$d/snippets.json" -Encoding UTF8
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int cx, int cy, uint f);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr h, int a, out RECT r, int s);
            public struct RECT { public int L, T, R, B; }
          }
          "@
          Add-Type -AssemblyName System.Drawing
          foreach ($t in @(@{ Name = 'screenshot'; Theme = 2; Args = '--x' }, @{ Name = 'screenshot-light'; Theme = 1; Args = '--x' }, @{ Name = 'screenshot-settings'; Theme = 2; Args = '--settings' })) {
            "{ `"Theme`": $($t.Theme) }" | Set-Content "$d/settings.json" -Encoding UTF8
            $app = Start-Process "$d/WinExpander.exe" -ArgumentList $t.Args -PassThru
            Start-Sleep 12
            $app.Refresh(); $h = $app.MainWindowHandle
            [W]::SetWindowPos($h, [IntPtr]::Zero, 40, 20, 980, 660, 0x40) | Out-Null
            [W]::SetForegroundWindow($h) | Out-Null
            Start-Sleep 3
            $r = New-Object W+RECT
            [W]::DwmGetWindowAttribute($h, 9, [ref]$r, 16) | Out-Null
            $w = $r.R - $r.L; $hh = $r.B - $r.T
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save("$PWD/$($t.Name).png")
            Stop-Process $app -Force
            Start-Sleep 2
          }
          Remove-Item "$d/snippets.json", "$d/settings.json", "$d/crash.log" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        continue-on-error: true
        with:
          name: screenshot
          path: screenshot*.png

      - name: Zip
        run: |
          Compress-Archive -Path publish/WinExpander/* -DestinationPath WinExpander-portable-${{ matrix.arch }}.zip
          Write-Host ('USAGE: Zip {0:N1} MB' -f ((Get-Item WinExpander-portable-${{ matrix.arch }}.zip).Length/1MB))

      - uses: actions/upload-artifact@v4
        with:
          name: WinExpander-portable-${{ matrix.arch }}
          path: WinExpander-portable-${{ matrix.arch }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Portable — download the zip for your PC (x64 for most, arm64 for Snapdragon), unzip anywhere, run `WinExpander.exe`. No install needed.

            ![WinExpander](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/screenshot.png)
          files: WinExpander-portable-${{ matrix.arch }}.zip
